<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBIHAR.com - Global Search Engine</title>
    <style>
        /* पूरे पेज की डिजाइन */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* मुख्य कंटेनर */
        .search-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* प्रीमियम लोगो डिजाइन */
        .logo {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }
        .logo .go {
            color: #1a73e8; /* प्रोफेशनल ब्लू */
        }
        .logo .bihar {
            color: #e67e22; /* बिहार की संस्कृति को दर्शाता केसरिया/ऑरेंज */
        }
        .logo .com {
            font-size: 1.2rem;
            color: #7f8c8d;
            font-weight: 400;
        }

        /* असली गूगल सर्च बॉक्स का स्टाइल */
        .gcse-search {
            margin-top: 20px;
            width: 100%;
        }

        /* फुटर का स्टाइल */
        .footer {
            position: absolute;
            bottom: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <!-- GoBIHAR लोगो -->
        <div class="logo">
            <span class="go">Go</span><span class="bihar">BIHAR</span><span class="com">.com</span>
        </div>

        <!-- यह कोड गूगल से असली ग्लोबल डेटा सर्च करके लाएगा -->
        <script async src="https://google.com"></script>
        <div class="gcse-search"></div>
    </div>

    <div class="footer">
        &copy; 2026 GoBIHAR.com | Connecting Bihar to the World
    </div>

</body>
</html>
